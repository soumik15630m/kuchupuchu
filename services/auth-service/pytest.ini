[pytest]
pythonpath = .
testpaths = tests

# Silences the PytestDeprecationWarning emitted on every run, and pins the
# behaviour explicitly rather than inheriting whatever a future
# pytest-asyncio decides the default should be.
asyncio_default_fixture_loop_scope = function

# pytest-randomly shuffles test order every run, which is what surfaced
# the TURN_HOSTNAME teardown bug (one module's autouse monkeypatch was
# DELETING a variable other modules depended on). Keep the shuffling --
# it earns its keep -- but every run prints its seed, so a failure can be
# reproduced with `-p randomly --randomly-seed=<n>` instead of being
# rerun until it goes green.
addopts = -p randomly
