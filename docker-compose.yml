# Phase 1 scope (design-doc-v6.md §13): SFU + minimal auth walking skeleton.
# wake-service / messaging-service (Phases 5-6) are stubbed as folders only —
# not wired in here yet. See §1a for the still-open port-forward/tunnel
# decision this stack depends on for reachability beyond the local network.

services:
  # Signs dev TLS certs for the current hostnames before anything
  # serving TLS starts. Does nothing unless DEV_AUTO_CERTS is true,
  # which is what keeps it safe in the base file. /caroot is the host's
  # mkcert CA: signing needs its private key, so there is no way to
  # produce host-trusted certs without mounting it.
  cert-init:
    build: ./infra/certgen
    env_file: .env
    environment:
      - DEV_AUTO_CERTS=${DEV_AUTO_CERTS:-false}
    volumes:
      - ./certs:/certs
      - ${MKCERT_CAROOT:-./infra/certgen/no-caroot}:/caroot:ro
    restart: "no"

  nginx:
    build: ./infra/nginx
    env_file: .env
    ports:
      - "443:443"
      - "3478:3478/udp"
      - "3478:3478/tcp"
      - "49160-49200:49160-49200/udp"
    depends_on:
      cert-init:
        condition: service_completed_successfully
      livekit:
        condition: service_started
      auth-service:
        condition: service_started
    volumes:
      - ./certs:/etc/letsencrypt:ro
      # §13 Phase 3/4 testing aid only -- getUserMedia() requires a secure
      # context (HTTPS, or specifically http://localhost), which a LAN IP
      # over plain HTTP never qualifies as. Serving the harness from this
      # same HTTPS origin, instead of a separate `python3 -m http.server`
      # on a different port/scheme, is what makes real camera/mic testing
      # across two machines possible at all -- not just a convenience.
      - ./testing/webrtc-harness:/usr/share/nginx/harness:ro
    restart: unless-stopped

  coturn:
    build: ./infra/coturn
    env_file: .env
    network_mode: "service:nginx" # shares nginx's network namespace so the
    # stream{} block in infra/nginx/nginx.conf.template can reach it at
    # 127.0.0.1:5349. Port mappings live on the nginx service above since a
    # container in `network_mode: service:X` can't declare its own ports.
    volumes:
      - ./certs:/etc/letsencrypt:ro
    depends_on:
      cert-init:
        condition: service_completed_successfully
    restart: unless-stopped

  redis:
    # Digest-pinned for the same reason as the built images -- see the
    # note at the top of infra/nginx/Dockerfile.
    image: redis:7-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
    # `:?` refuses to start rather than substituting "" and running
    # --requirepass with an empty password.
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env (openssl rand -hex 32)}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    restart: unless-stopped

  livekit:
    build: ./infra/livekit
    env_file: .env
    ports:
      - "7881:7881/tcp"
      - "20000-20100:20000-20100/udp"
    depends_on:
      - redis
    restart: unless-stopped

  auth-service:
    build: ./services/auth-service
    env_file: .env
    volumes:
      - sqlite-data:/data
    environment:
      # Server-to-server admin API calls (RemoveParticipant on revoke,
      # app/livekit_admin.py) go straight to LiveKit over the compose
      # network -- NOT through nginx's public-facing LIVEKIT_URL. That
      # hostname is meant for *external clients* and, for local dev in
      # particular, may resolve to 127.0.0.1 (e.g. nip.io) wherever the
      # lookup happens -- including from inside this very container, where
      # 127.0.0.1 is auth-service's own loopback, not nginx's. Going direct
      # to the "livekit" service name sidesteps that entirely, and there's
      # no reason for internal admin calls to pay for the extra TLS hop
      # anyway.
      - LIVEKIT_INTERNAL_URL=http://livekit:7880
    depends_on:
      - livekit
    restart: unless-stopped

volumes:
  redis-data:
  sqlite-data:
